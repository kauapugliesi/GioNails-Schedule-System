spring:
  application:
    name: agenda
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenda_giovanna}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é controlado só pelo Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Maceio
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  timezone: America/Maceio
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
