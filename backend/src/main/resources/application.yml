spring:
  application:
    name: gionails-schedule-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gionails_schedule}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é controlado só pelo Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Maceio
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  timezone: America/Maceio
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}                       # obrigatório, mínimo 32 caracteres
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  # Conta da manicure (administradora) criada na primeira inicialização, se ainda não existir.
  manicure-inicial:
    nome: ${MANICURE_NOME:}
    telefone: ${MANICURE_TELEFONE:}
    senha: ${MANICURE_SENHA:}
